name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Format, analyze, test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/core
          - apps/pos_app
          - apps/manager_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Check formatting
        working-directory: ${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: ${{ matrix.package }}
        run: flutter test
